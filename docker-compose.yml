services:
  db:
    image: mariadb:11.7
    container_name: rms-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${DB_NAME:-monitoring}
      MARIADB_USER: ${DB_USER:-monitoring}
      MARIADB_PASSWORD: ${DB_PASSWORD:-monitoring}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - rms-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: rms-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-monitoring}
      DB_USER: ${DB_USER:-monitoring}
      DB_PASSWORD: ${DB_PASSWORD:-monitoring}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REALTIME_INTERVAL_SECONDS: ${REALTIME_INTERVAL_SECONDS:-1.0}
      ANOMALY_THRESHOLD: ${ANOMALY_THRESHOLD:-80.0}
      BATCH_SIZE: ${BATCH_SIZE:-10}
      BATCH_INTERVAL_SECONDS: ${BATCH_INTERVAL_SECONDS:-5.0}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - rms-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: rms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    networks:
      - rms-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8501/_stcore/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mariadb_data:

networks:
  rms-net:
    driver: bridge
